<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Bundle Inspection</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px 16px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; text-align: center; }

    .photo-box {
      width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px;
      overflow: hidden; border: 2px dashed #334155; min-height: 200px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .photo-box canvas { width: 100%; display: block; }
    .placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #475569; padding: 40px; }
    .placeholder svg { width: 52px; height: 52px; }

    #fileInput { display: none; }

    .btn-row { display: flex; gap: 8px; margin-top: 12px; width: 100%; max-width: 480px; flex-wrap: wrap; }
    button {
      flex: 1; padding: 13px 10px; border: none; border-radius: 12px;
      font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; min-width: 80px;
    }
    button:active { opacity: 0.75; }
    #btnCamera { background: #6366f1; color: #fff; }
    #btnRotate { background: #334155; color: #94a3b8; display: none; flex: 0; padding: 13px 16px; }
    #btnScan { background: #0ea5e9; color: #fff; }
    #btnScan:disabled { background: #1e3a4a; color: #475569; cursor: default; }

    #result {
      margin-top: 16px; width: 100%; max-width: 480px;
      background: #1e293b; border-radius: 16px; padding: 18px; display: none;
    }
    .badge {
      display: inline-block; padding: 5px 16px; border-radius: 99px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 12px;
    }
    .badge.pass { background: #14532d; color: #4ade80; }
    .badge.fail { background: #4c0519; color: #f87171; }
    .badge.scanning { background: #1e3a5f; color: #7dd3fc; }

    .progress-bar { width: 100%; height: 4px; background: #0f172a; border-radius: 2px; margin-bottom: 12px; }
    .progress-fill { height: 100%; background: #0ea5e9; border-radius: 2px; transition: width 0.2s; width: 0%; }

    .rl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
    .rv { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 12px; word-break: break-all; }
    .raw { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #64748b; white-space: pre-wrap; font-family: monospace; max-height: 100px; overflow-y: auto; }

    .fuzzy-note { font-size: 0.72rem; color: #f59e0b; margin-top: 6px; display: none; }

    #partsSection { margin-top: 16px; width: 100%; max-width: 480px; }
    #toggleParts { background: #1e293b; color: #94a3b8; border-radius: 10px; font-size: 0.83rem; padding: 10px 16px; width: 100%; text-align: left; }
    #partsList { display: none; background: #1e293b; border-radius: 10px; margin-top: 8px; padding: 12px 16px; }
    #partsList li { list-style: none; font-size: 0.83rem; font-family: monospace; padding: 5px 0; border-bottom: 1px solid #0f172a; color: #cbd5e1; }
    #partsList li:last-child { border-bottom: none; }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input {
      flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 10px; color: #f8fafc; font-size: 0.83rem; font-family: monospace; text-transform: uppercase;
    }
    .add-row button { flex: 0; padding: 8px 12px; font-size: 0.83rem; background: #6366f1; color: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🔍 Bundle Inspection OCR</h1>
  <p class="subtitle">Take a photo → rotate if needed → Scan Label</p>

  <div class="photo-box" id="photoBox" onclick="handleBoxClick()">
    <div class="placeholder" id="placeholder">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <p>Tap to take a photo</p>
    </div>
    <canvas id="displayCanvas" style="display:none"></canvas>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="btn-row">
    <button id="btnCamera" onclick="document.getElementById('fileInput').click()">📷 Camera</button>
    <button id="btnRotate" onclick="rotateImage()">↻ Rotate</button>
    <button id="btnScan" disabled onclick="scanImage()">Scan Label</button>
  </div>

  <div id="result">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="badge" id="badge">Scanning…</span>
    <div class="rl">Detected Part Number</div>
    <div class="rv" id="detectedPart">—</div>
    <div class="fuzzy-note" id="fuzzyNote"></div>
    <div class="rl">Raw OCR Text</div>
    <div class="raw" id="rawText"></div>
  </div>

  <div id="partsSection">
    <button id="toggleParts" onclick="togglePartsList()">📋 Approved Parts List ▾</button>
    <div id="partsList">
      <ul id="partsUl"></ul>
      <div class="add-row">
        <input type="text" id="newPart" placeholder="ADD NEW PART NUMBER" />
        <button onclick="addPart()">Add</button>
      </div>
    </div>
  </div>

<script>
  let imgElement = null;   // original loaded image
  let rotation = 0;        // current display rotation (0/90/180/270)
  let worker = null;
  let cachedParts = [];

  const displayCanvas = document.getElementById("displayCanvas");
  const dCtx = displayCanvas.getContext("2d");

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    try { const r = await fetch("/parts"); cachedParts = await r.json(); } catch {}
    worker = await Tesseract.createWorker("eng", 1, {
      logger: m => {
        if (m.status === "recognizing text")
          document.getElementById("progressFill").style.width = (m.progress * 100) + "%";
      }
    });
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
  }
  init();

  function handleBoxClick() {
    if (!imgElement) document.getElementById("fileInput").click();
  }

  // ── Load image ────────────────────────────────────────────────────────────
  document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        imgElement = img;
        rotation = 0;
        drawRotated();
        document.getElementById("placeholder").style.display = "none";
        displayCanvas.style.display = "block";
        document.getElementById("btnRotate").style.display = "inline-block";
        document.getElementById("btnScan").disabled = false;
        document.getElementById("result").style.display = "none";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ── Draw with current rotation ────────────────────────────────────────────
  function drawRotated() {
    const swap = rotation === 90 || rotation === 270;
    const w = swap ? imgElement.height : imgElement.width;
    const h = swap ? imgElement.width  : imgElement.height;
    displayCanvas.width  = w;
    displayCanvas.height = h;
    dCtx.save();
    dCtx.translate(w / 2, h / 2);
    dCtx.rotate(rotation * Math.PI / 180);
    dCtx.drawImage(imgElement, -imgElement.width / 2, -imgElement.height / 2);
    dCtx.restore();
  }

  function rotateImage() {
    if (!imgElement) return;
    rotation = (rotation + 90) % 360;
    drawRotated();
  }

  // ── Preprocessing: adaptive threshold ────────────────────────────────────
  // Compares each pixel to blurred (local average).
  // Pixels much darker than surroundings = text → black. Everything else → white.
  function preprocess(srcCanvas) {
    const MAX = 900;
    const scale = srcCanvas.width > MAX ? MAX / srcCanvas.width : 1;
    const w = Math.round(srcCanvas.width * scale);
    const h = Math.round(srcCanvas.height * scale);

    // Original pixels
    const cA = document.createElement("canvas");
    cA.width = w; cA.height = h;
    const ctxA = cA.getContext("2d");
    ctxA.drawImage(srcCanvas, 0, 0, w, h);
    const origPx = ctxA.getImageData(0, 0, w, h).data;

    // Blurred pixels (local average)
    const cB = document.createElement("canvas");
    cB.width = w; cB.height = h;
    const ctxB = cB.getContext("2d");
    ctxB.filter = "blur(18px)";
    ctxB.drawImage(srcCanvas, 0, 0, w, h);
    const blurPx = ctxB.getImageData(0, 0, w, h).data;

    // Adaptive threshold output
    const cOut = document.createElement("canvas");
    cOut.width = w; cOut.height = h;
    const ctxOut = cOut.getContext("2d");
    const out = ctxOut.createImageData(w, h);
    const d = out.data;
    for (let i = 0; i < origPx.length; i += 4) {
      const og = 0.299*origPx[i]  + 0.587*origPx[i+1]  + 0.114*origPx[i+2];
      const bg = 0.299*blurPx[i]  + 0.587*blurPx[i+1]  + 0.114*blurPx[i+2];
      const v  = (og - bg < -12) ? 0 : 255;
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    ctxOut.putImageData(out, 0, 0);
    return cOut;
  }

  // ── Fuzzy match (Levenshtein ≤ 2) ────────────────────────────────────────
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i === 0 ? j : j === 0 ? i : 0));
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  }

  function fuzzyMatch(detected, parts) {
    // Exact match first
    if (parts.includes(detected)) return { match: detected, exact: true };
    // Fuzzy: allow up to 2 character differences
    let best = null, bestDist = 3;
    for (const p of parts) {
      const dist = levenshtein(detected, p);
      if (dist < bestDist) { bestDist = dist; best = p; }
    }
    if (best) return { match: best, exact: false, dist: bestDist };
    return null;
  }

  // ── Scan ──────────────────────────────────────────────────────────────────
  async function scanImage() {
    if (!imgElement || !worker) return;

    const badge = document.getElementById("badge");
    document.getElementById("result").style.display = "block";
    badge.className = "badge scanning";
    badge.textContent = "Scanning…";
    document.getElementById("progressFill").style.width = "0%";
    document.getElementById("detectedPart").textContent = "—";
    document.getElementById("rawText").textContent = "";
    document.getElementById("fuzzyNote").style.display = "none";
    document.getElementById("btnScan").disabled = true;

    const processed = preprocess(displayCanvas);

    try {
      const { data } = await worker.recognize(processed);
      const rawText = data.text.trim();
      const tokens = rawText.toUpperCase().match(/[A-Z0-9][A-Z0-9_\-\.]{2,}/g) || [];
      const best = tokens.length ? tokens.reduce((a, b) => b.length > a.length ? b : a) : rawText.trim().toUpperCase();

      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("rawText").textContent = rawText || "(nothing detected)";
      document.getElementById("detectedPart").textContent = best || "(nothing detected)";

      const result = fuzzyMatch(best, cachedParts);
      if (result) {
        badge.className = "badge pass";
        badge.textContent = "✓ PASS";
        if (!result.exact) {
          const note = document.getElementById("fuzzyNote");
          note.style.display = "block";
          note.textContent = `⚠ Fuzzy match: OCR read "${best}", matched to "${result.match}" (${result.dist} char diff)`;
        }
      } else {
        badge.className = "badge fail";
        badge.textContent = "✗ FAIL";
      }
    } catch (err) {
      badge.className = "badge fail";
      badge.textContent = "Error";
      document.getElementById("detectedPart").textContent = err.message;
    }
    document.getElementById("btnScan").disabled = false;
  }

  // ── Parts list ────────────────────────────────────────────────────────────
  async function togglePartsList() {
    const list = document.getElementById("partsList");
    if (list.style.display === "block") { list.style.display = "none"; return; }
    list.style.display = "block";
    renderParts();
  }
  function renderParts() {
    document.getElementById("partsUl").innerHTML = cachedParts.length
      ? cachedParts.map(p => `<li>${p}</li>`).join("") : "<li>No parts loaded</li>";
  }
  async function addPart() {
    const input = document.getElementById("newPart");
    const pn = input.value.trim().toUpperCase();
    if (!pn) return;
    try { await fetch("/parts", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({part_number: pn}) }); } catch {}
    if (!cachedParts.includes(pn)) cachedParts.push(pn);
    input.value = ""; renderParts();
  }
  document.getElementById("newPart").addEventListener("keydown", e => { if (e.key === "Enter") addPart(); });
</script>
</body>
</html>
