<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Bundle Inspection</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; text-align: center; }

    .photo-box {
      width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px;
      overflow: hidden; border: 2px dashed #334155; cursor: pointer; min-height: 200px;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-box img { width: 100%; display: block; }
    .placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #475569; padding: 40px; }
    .placeholder svg { width: 52px; height: 52px; }

    #fileInput { display: none; }

    .btn-row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 480px; }
    button {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    button:active { opacity: 0.75; }
    #btnCamera { background: #6366f1; color: #fff; }
    #btnScan { background: #0ea5e9; color: #fff; }
    #btnScan:disabled { background: #1e3a4a; color: #475569; cursor: default; }

    #result {
      margin-top: 20px; width: 100%; max-width: 480px;
      background: #1e293b; border-radius: 16px; padding: 20px; display: none;
    }
    .badge {
      display: inline-block; padding: 5px 16px; border-radius: 99px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .badge.pass { background: #14532d; color: #4ade80; }
    .badge.fail { background: #4c0519; color: #f87171; }
    .badge.scanning { background: #1e3a5f; color: #7dd3fc; }

    .progress-bar { width: 100%; height: 4px; background: #0f172a; border-radius: 2px; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: #0ea5e9; border-radius: 2px; transition: width 0.2s; width: 0%; }

    .rl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
    .rv { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 14px; word-break: break-all; }
    .raw { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 0.75rem; color: #64748b; white-space: pre-wrap; font-family: monospace; }

    /* Preprocessed preview */
    #previewWrap { margin-top: 14px; display: none; }
    #previewWrap p { font-size: 0.7rem; color: #475569; margin-bottom: 4px; }
    #previewCanvas { width: 100%; border-radius: 8px; border: 1px solid #334155; }

    #partsSection { margin-top: 20px; width: 100%; max-width: 480px; }
    #toggleParts { background: #1e293b; color: #94a3b8; border-radius: 10px; font-size: 0.83rem; padding: 10px 16px; width: 100%; text-align: left; }
    #partsList { display: none; background: #1e293b; border-radius: 10px; margin-top: 8px; padding: 12px 16px; }
    #partsList li { list-style: none; font-size: 0.83rem; font-family: monospace; padding: 5px 0; border-bottom: 1px solid #0f172a; color: #cbd5e1; }
    #partsList li:last-child { border-bottom: none; }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input {
      flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 10px; color: #f8fafc; font-size: 0.83rem; font-family: monospace; text-transform: uppercase;
    }
    .add-row button { flex: 0; padding: 8px 12px; font-size: 0.83rem; background: #6366f1; color: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🔍 Bundle Inspection OCR</h1>
  <p class="subtitle">Take a close-up photo of the label, then tap Scan</p>

  <div class="photo-box" id="photoBox" onclick="document.getElementById('fileInput').click()">
    <div class="placeholder" id="placeholder">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <p>Tap to take a photo</p>
    </div>
    <img id="photoPreview" style="display:none" />
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="btn-row">
    <button id="btnCamera" onclick="document.getElementById('fileInput').click()">📷 Camera</button>
    <button id="btnScan" disabled onclick="scanImage()">Scan Label</button>
  </div>

  <!-- Shows what Tesseract actually processes -->
  <div id="previewWrap" style="width:100%;max-width:480px;">
    <p>🔬 Processed image (what OCR sees):</p>
    <canvas id="previewCanvas"></canvas>
  </div>

  <div id="result">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="badge scanning" id="badge">Scanning…</span>
    <div class="rl">Detected Part Number</div>
    <div class="rv" id="detectedPart">—</div>
    <div class="rl">Raw OCR Text</div>
    <div class="raw" id="rawText"></div>
  </div>

  <div id="partsSection">
    <button id="toggleParts" onclick="togglePartsList()">📋 Approved Parts List ▾</button>
    <div id="partsList">
      <ul id="partsUl"></ul>
      <div class="add-row">
        <input type="text" id="newPart" placeholder="ADD NEW PART NUMBER" />
        <button onclick="addPart()">Add</button>
      </div>
    </div>
  </div>

<script>
  let imgElement = null;
  let worker = null;
  let cachedParts = [];

  // Load Tesseract + parts list on page open
  async function init() {
    // Parts list
    try {
      const r = await fetch("/parts");
      cachedParts = await r.json();
    } catch { cachedParts = []; }

    // Tesseract worker
    worker = await Tesseract.createWorker("eng", 1, {
      logger: m => {
        if (m.status === "recognizing text")
          document.getElementById("progressFill").style.width = (m.progress * 100) + "%";
      }
    });
    // PSM 6 = uniform block of text — best for a single label
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
  }
  init();

  document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        imgElement = img;
        const preview = document.getElementById("photoPreview");
        preview.src = ev.target.result;
        preview.style.display = "block";
        document.getElementById("placeholder").style.display = "none";
        document.getElementById("btnScan").disabled = false;
        document.getElementById("result").style.display = "none";
        document.getElementById("previewWrap").style.display = "none";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  /**
   * Preprocess image for OCR:
   * 1. Resize to max 1000px wide (keeps memory low)
   * 2. Convert to grayscale
   * 3. Apply threshold at 140 — white label + black text survives cleanly;
   *    gray metal surface (pixel ~150-180) becomes white (no text noise)
   */
  function preprocessToCanvas(img) {
    const MAX = 1000;
    const scale = img.width > MAX ? MAX / img.width : 1;
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);

    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);

    const id = ctx.getImageData(0, 0, w, h);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      // Grayscale
      const g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      // Threshold: dark pixels (text) → black; light/mid pixels → white
      const v = g < 140 ? 0 : 255;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    ctx.putImageData(id, 0, 0);
    return c;
  }

  async function scanImage() {
    if (!imgElement || !worker) return;

    const badge = document.getElementById("badge");
    document.getElementById("result").style.display = "block";
    badge.className = "badge scanning";
    badge.textContent = "Processing…";
    document.getElementById("progressFill").style.width = "0%";
    document.getElementById("detectedPart").textContent = "—";
    document.getElementById("rawText").textContent = "";
    document.getElementById("btnScan").disabled = true;

    // Preprocess
    const processed = preprocessToCanvas(imgElement);

    // Show the processed image so user can see what OCR receives
    const prev = document.getElementById("previewCanvas");
    prev.width = processed.width; prev.height = processed.height;
    prev.getContext("2d").drawImage(processed, 0, 0);
    document.getElementById("previewWrap").style.display = "block";

    badge.textContent = "Scanning…";

    try {
      const { data } = await worker.recognize(processed);
      const rawText = data.text.trim();

      // Pick the longest alphanumeric token
      const tokens = rawText.toUpperCase().match(/[A-Z0-9][A-Z0-9_\-\.]{2,}/g) || [];
      const best = tokens.length ? tokens.reduce((a, b) => b.length > a.length ? b : a) : rawText.trim().toUpperCase();

      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("rawText").textContent = rawText || "(nothing detected)";

      // Validate against cached parts list
      const passed = cachedParts.includes(best);
      badge.className = "badge " + (passed ? "pass" : "fail");
      badge.textContent = passed ? "✓ PASS" : "✗ FAIL";
      document.getElementById("detectedPart").textContent = best || "(nothing detected)";
    } catch (err) {
      badge.className = "badge fail";
      badge.textContent = "Error";
      document.getElementById("detectedPart").textContent = err.message;
    }

    document.getElementById("btnScan").disabled = false;
  }

  async function togglePartsList() {
    const list = document.getElementById("partsList");
    if (list.style.display === "block") { list.style.display = "none"; return; }
    list.style.display = "block";
    renderParts();
  }
  function renderParts() {
    const ul = document.getElementById("partsUl");
    ul.innerHTML = cachedParts.length
      ? cachedParts.map(p => `<li>${p}</li>`).join("")
      : "<li>No parts loaded</li>";
  }
  async function addPart() {
    const input = document.getElementById("newPart");
    const pn = input.value.trim().toUpperCase();
    if (!pn) return;
    try {
      await fetch("/parts", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({part_number: pn}) });
      if (!cachedParts.includes(pn)) cachedParts.push(pn);
    } catch { cachedParts.push(pn); }  // save locally even if server unreachable
    input.value = "";
    renderParts();
  }
  document.getElementById("newPart").addEventListener("keydown", e => { if (e.key === "Enter") addPart(); });
</script>
</body>
</html>
