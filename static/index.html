<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OCR Bundle Inspection</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
    h1{font-size:1.3rem;font-weight:700;margin-bottom:4px;color:#f8fafc}
    .sub{font-size:.8rem;color:#94a3b8;margin-bottom:16px;text-align:center}
    #canvas{width:100%;max-width:480px;border-radius:14px;display:block;touch-action:none;cursor:crosshair;background:#1e293b;border:2px dashed #334155}
    #fileInput{display:none}
    .hint{font-size:.75rem;color:#7dd3fc;background:#1e3a5f;border-radius:8px;padding:7px 12px;margin-top:8px;width:100%;max-width:480px;text-align:center}
    .btn-row{display:flex;gap:8px;margin-top:10px;width:100%;max-width:480px}
    button{flex:1;padding:13px;border:none;border-radius:12px;font-size:.93rem;font-weight:600;cursor:pointer;transition:opacity .15s}
    button:active{opacity:.75}
    #btnCamera{background:#6366f1;color:#fff}
    #btnClear{background:#334155;color:#94a3b8;flex:0;padding:13px 14px}
    #btnScan{background:#0ea5e9;color:#fff}
    #btnScan:disabled{background:#1e3a4a;color:#475569;cursor:default}
    #selInfo{font-size:.72rem;color:#64748b;margin-top:6px;width:100%;max-width:480px;text-align:center;min-height:1.2em}
    #result{margin-top:14px;width:100%;max-width:480px;background:#1e293b;border-radius:14px;padding:18px;display:none}
    .badge{display:inline-block;padding:4px 14px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
    .badge.pass{background:#14532d;color:#4ade80}
    .badge.fail{background:#4c0519;color:#f87171}
    .badge.scanning{background:#1e3a5f;color:#7dd3fc}
    .progress-bar{width:100%;height:4px;background:#0f172a;border-radius:2px;margin-bottom:12px;overflow:hidden}
    .progress-fill{height:100%;background:#0ea5e9;border-radius:2px;transition:width .2s;width:0}
    .rl{font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
    .rv{font-size:1.25rem;font-weight:700;color:#f8fafc;margin-bottom:12px;word-break:break-all}
    .raw{background:#0f172a;border-radius:8px;padding:10px;font-size:.75rem;color:#64748b;white-space:pre-wrap;font-family:monospace;max-height:90px;overflow-y:auto}
    .fuzzy{font-size:.72rem;color:#f59e0b;margin-top:6px;display:none}
    #partsSection{margin-top:14px;width:100%;max-width:480px}
    #toggleParts{background:#1e293b;color:#94a3b8;border-radius:10px;font-size:.83rem;padding:10px 16px;width:100%;text-align:left}
    #partsList{display:none;background:#1e293b;border-radius:10px;margin-top:8px;padding:12px 16px}
    #partsList li{list-style:none;font-size:.83rem;font-family:monospace;padding:5px 0;border-bottom:1px solid #0f172a;color:#cbd5e1}
    #partsList li:last-child{border-bottom:none}
    .add-row{display:flex;gap:8px;margin-top:10px}
    .add-row input{flex:1;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;color:#f8fafc;font-size:.83rem;font-family:monospace;text-transform:uppercase}
    .add-row button{flex:0;padding:8px 12px;font-size:.83rem;background:#6366f1;color:#fff;border-radius:8px}
  </style>
</head>
<body>
  <h1>🔍 Bundle Inspection OCR</h1>
  <p class="sub">Take photo → drag on label → Scan</p>

  <canvas id="canvas" width="480" height="320"></canvas>
  <div class="hint">✏️ Drag your finger over the white label to select it</div>
  <input type="file" id="fileInput" accept="image/*" capture="environment"/>
  <div id="selInfo">No selection — tap canvas after photo to select label</div>

  <div class="btn-row">
    <button id="btnCamera" onclick="document.getElementById('fileInput').click()">📷 Camera</button>
    <button id="btnClear" onclick="clearSel()">✕ Clear</button>
    <button id="btnScan" disabled onclick="scanImage()">Scan Label</button>
  </div>

  <div id="result">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <span class="badge scanning" id="badge">Scanning…</span>
    <div class="rl">Detected Part Number</div>
    <div class="rv" id="detected">—</div>
    <div class="fuzzy" id="fuzzyNote"></div>
    <div class="rl">Raw OCR Text</div>
    <div class="raw" id="rawText"></div>
  </div>

  <div id="partsSection">
    <button id="toggleParts" onclick="toggleParts()">📋 Approved Parts List ▾</button>
    <div id="partsList">
      <ul id="partsUl"></ul>
      <div class="add-row">
        <input type="text" id="newPart" placeholder="ADD NEW PART NUMBER"/>
        <button onclick="addPart()">Add</button>
      </div>
    </div>
  </div>

<script>
  const cv   = document.getElementById("canvas");
  const ctx  = cv.getContext("2d");
  let origImg  = null;   // full-res Image element
  let dispRect = null;   // canvas bounding rect (updated on each interaction)
  let sel      = null;   // {x,y,w,h} in CANVAS display pixels
  let drag     = null;   // drag start in canvas pixels
  let worker   = null;
  let cachedParts = [];

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    drawPlaceholder();
    try { const r = await fetch("/parts"); cachedParts = await r.json(); } catch {}
    worker = await Tesseract.createWorker("eng", 1, {
      logger: m => {
        if (m.status === "recognizing text")
          document.getElementById("progFill").style.width = (m.progress*100)+"%";
      }
    });
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
  }
  init();

  function drawPlaceholder() {
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#475569";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Tap 📷 Camera to take a photo", cv.width/2, cv.height/2);
  }

  // ── Load photo ────────────────────────────────────────────────────────────
  document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        origImg = img;
        sel = null;
        fitAndDraw();
        document.getElementById("btnScan").disabled = false;
        document.getElementById("result").style.display = "none";
        document.getElementById("selInfo").textContent = "Drag over the label to select it";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Fit image into canvas maintaining aspect ratio
  function fitAndDraw() {
    const maxW = cv.offsetWidth  || 480;
    const scale = maxW / origImg.width;
    cv.width  = origImg.width  * scale;
    cv.height = origImg.height * scale;
    redraw();
  }

  function redraw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    if (origImg) ctx.drawImage(origImg, 0, 0, cv.width, cv.height);
    if (sel && sel.w > 2 && sel.h > 2) {
      // dim outside
      ctx.fillStyle = "rgba(0,0,0,0.50)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.clearRect(sel.x, sel.y, sel.w, sel.h);
      // redraw image in selection (so it shows through)
      ctx.drawImage(origImg,
        sel.x / cv.width * origImg.width,
        sel.y / cv.height * origImg.height,
        sel.w / cv.width * origImg.width,
        sel.h / cv.height * origImg.height,
        sel.x, sel.y, sel.w, sel.h);
      ctx.strokeStyle = "#0ea5e9";
      ctx.lineWidth = 2;
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      document.getElementById("selInfo").textContent =
        `✅ Selection active (${Math.round(sel.w)}×${Math.round(sel.h)}px on screen) — tap Scan Label`;
    } else {
      document.getElementById("selInfo").textContent =
        origImg ? "Drag over the label to select it" : "Take a photo first";
    }
  }

  // ── Get canvas-relative coordinates ──────────────────────────────────────
  function getXY(e) {
    dispRect = cv.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    // Scale from CSS pixels to canvas pixels
    const scaleX = cv.width  / dispRect.width;
    const scaleY = cv.height / dispRect.height;
    return {
      x: (src.clientX - dispRect.left) * scaleX,
      y: (src.clientY - dispRect.top)  * scaleY
    };
  }

  // ── Mouse events (desktop) ────────────────────────────────────────────────
  cv.addEventListener("mousedown", e => { if (!origImg) return; drag = getXY(e); e.preventDefault(); });
  cv.addEventListener("mousemove", e => {
    if (!drag) return;
    const cur = getXY(e);
    sel = mkSel(drag, cur); redraw(); e.preventDefault();
  });
  cv.addEventListener("mouseup", e => {
    if (!drag) return;
    const cur = getXY(e); sel = mkSel(drag, cur); drag = null; redraw(); e.preventDefault();
  });

  // ── Touch events (mobile) ─────────────────────────────────────────────────
  cv.addEventListener("touchstart", e => { if (!origImg) return; drag = getXY(e); e.preventDefault(); }, {passive:false});
  cv.addEventListener("touchmove",  e => {
    if (!drag) return;
    const cur = getXY(e); sel = mkSel(drag, cur); redraw(); e.preventDefault();
  }, {passive:false});
  cv.addEventListener("touchend",   e => {
    if (!drag) return;
    const t = e.changedTouches[0];
    dispRect = cv.getBoundingClientRect();
    const scaleX = cv.width / dispRect.width, scaleY = cv.height / dispRect.height;
    const cur = { x:(t.clientX-dispRect.left)*scaleX, y:(t.clientY-dispRect.top)*scaleY };
    sel = mkSel(drag, cur); drag = null; redraw(); e.preventDefault();
  }, {passive:false});

  function mkSel(a, b) {
    return {
      x: Math.max(0, Math.min(a.x, b.x)),
      y: Math.max(0, Math.min(a.y, b.y)),
      w: Math.min(cv.width,  Math.abs(b.x - a.x)),
      h: Math.min(cv.height, Math.abs(b.y - a.y))
    };
  }

  function clearSel() { sel = null; redraw(); }

  // ── Extract cropped region at full resolution ─────────────────────────────
  function extractCrop() {
    if (!sel || sel.w < 5 || sel.h < 5) return null;
    // Map canvas coords → original image coords
    const sx = sel.x / cv.width  * origImg.width;
    const sy = sel.y / cv.height * origImg.height;
    const sw = sel.w / cv.width  * origImg.width;
    const sh = sel.h / cv.height * origImg.height;
    // Scale up for OCR
    const TARGET = 900;
    const scale  = sw < TARGET ? TARGET / sw : 1;
    const out = document.createElement("canvas");
    out.width  = Math.round(sw * scale);
    out.height = Math.round(sh * scale);
    out.getContext("2d").drawImage(origImg, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  // ── Fuzzy match ───────────────────────────────────────────────────────────
  function lev(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
  function fuzzyMatch(det,parts){if(parts.includes(det))return{match:det,exact:true};let best=null,dist=3;for(const p of parts){const d=lev(det,p);if(d<dist){dist=d;best=p;}}return best?{match:best,exact:false,dist}:null;}

  // ── Scan ──────────────────────────────────────────────────────────────────
  async function scanImage() {
    if (!origImg || !worker) return;

    const crop = extractCrop();
    if (!crop) {
      alert("Please drag over the label area first, then tap Scan Label.");
      return;
    }

    const badge = document.getElementById("badge");
    document.getElementById("result").style.display = "block";
    badge.className = "badge scanning"; badge.textContent = "Scanning…";
    document.getElementById("progFill").style.width = "0";
    document.getElementById("detected").textContent = "—";
    document.getElementById("rawText").textContent = "";
    document.getElementById("fuzzyNote").style.display = "none";
    document.getElementById("btnScan").disabled = true;

    try {
      const {data} = await worker.recognize(crop);
      const raw    = data.text.trim();
      const tokens = raw.toUpperCase().match(/[A-Z0-9][A-Z0-9_\-\.]{2,}/g) || [];
      const best   = tokens.length ? tokens.reduce((a,b)=>b.length>a.length?b:a) : raw.toUpperCase().trim();

      document.getElementById("progFill").style.width = "100%";
      document.getElementById("rawText").textContent  = raw || "(nothing detected)";
      document.getElementById("detected").textContent = best || "(nothing detected)";

      const match = fuzzyMatch(best, cachedParts);
      if (match) {
        badge.className="badge pass"; badge.textContent="✓ PASS";
        if (!match.exact) {
          const n = document.getElementById("fuzzyNote");
          n.style.display="block";
          n.textContent=`⚠ Fuzzy match: "${best}" → "${match.match}" (${match.dist} char diff)`;
        }
      } else {
        badge.className="badge fail"; badge.textContent="✗ FAIL";
      }
    } catch(err) {
      badge.className="badge fail"; badge.textContent="Error";
      document.getElementById("detected").textContent=err.message;
    }
    document.getElementById("btnScan").disabled = false;
  }

  // ── Parts list ────────────────────────────────────────────────────────────
  async function toggleParts(){const l=document.getElementById("partsList");if(l.style.display==="block"){l.style.display="none";return;}l.style.display="block";renderParts();}
  function renderParts(){document.getElementById("partsUl").innerHTML=cachedParts.length?cachedParts.map(p=>`<li>${p}</li>`).join(""):"<li>No parts loaded</li>";}
  async function addPart(){const inp=document.getElementById("newPart");const pn=inp.value.trim().toUpperCase();if(!pn)return;try{await fetch("/parts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({part_number:pn})});}catch{}if(!cachedParts.includes(pn)){cachedParts.push(pn);cachedParts.sort();}inp.value="";renderParts();}
  document.getElementById("newPart").addEventListener("keydown",e=>{if(e.key==="Enter")addPart();});
</script>
</body>
</html>
