<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Bundle Inspection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; text-align: center; }

    .photo-box {
      width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px;
      overflow: hidden; border: 2px dashed #334155; min-height: 200px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .photo-box img { width: 100%; display: block; }
    .placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #475569; padding: 40px; }
    .placeholder svg { width: 52px; height: 52px; }
    #fileInput { display: none; }

    .btn-row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 480px; }
    button {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    button:active { opacity: 0.75; }
    #btnCamera { background: #6366f1; color: #fff; }
    #btnScan { background: #0ea5e9; color: #fff; }
    #btnScan:disabled { background: #1e3a4a; color: #475569; cursor: default; }

    #result {
      margin-top: 20px; width: 100%; max-width: 480px;
      background: #1e293b; border-radius: 16px; padding: 20px; display: none;
    }
    .badge {
      display: inline-block; padding: 5px 16px; border-radius: 99px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .badge.pass    { background: #14532d; color: #4ade80; }
    .badge.fail    { background: #4c0519; color: #f87171; }
    .badge.loading { background: #1e3a5f; color: #7dd3fc; }

    .progress-bar { width: 100%; height: 4px; background: #0f172a; border-radius: 2px; margin-bottom: 14px; overflow: hidden; }
    .progress-fill { height: 100%; background: #0ea5e9; border-radius: 2px; }
    .indeterminate { animation: slide 1.2s infinite; }
    @keyframes slide { 0%{margin-left:-40%;width:40%} 100%{margin-left:100%;width:40%} }

    .rl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
    .rv { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 14px; word-break: break-all; }
    .raw { background: #0f172a; border-radius: 8px; padding: 10px; font-size: 0.78rem; color: #64748b; white-space: pre-wrap; font-family: monospace; }

    #partsSection { margin-top: 20px; width: 100%; max-width: 480px; }
    #toggleParts { background: #1e293b; color: #94a3b8; border-radius: 10px; font-size: 0.83rem; padding: 10px 16px; width: 100%; text-align: left; }
    #partsList { display: none; background: #1e293b; border-radius: 10px; margin-top: 8px; padding: 12px 16px; }
    #partsList li { list-style: none; font-size: 0.83rem; font-family: monospace; padding: 5px 0; border-bottom: 1px solid #0f172a; color: #cbd5e1; }
    #partsList li:last-child { border-bottom: none; }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input {
      flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 10px; color: #f8fafc; font-size: 0.83rem; font-family: monospace; text-transform: uppercase;
    }
    .add-row button { flex: 0; padding: 8px 12px; font-size: 0.83rem; background: #6366f1; color: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🔍 Bundle Inspection OCR</h1>
  <p class="subtitle">Take a photo of the label and tap Scan</p>

  <div class="photo-box" id="photoBox" onclick="document.getElementById('fileInput').click()">
    <div class="placeholder" id="placeholder">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <p>Tap to take a photo</p>
    </div>
    <img id="preview" style="display:none" />
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" />

  <div class="btn-row">
    <button id="btnCamera" onclick="document.getElementById('fileInput').click()">📷 Camera</button>
    <button id="btnScan" disabled onclick="scan()">Scan Label</button>
  </div>

  <div id="result">
    <div class="progress-bar"><div class="progress-fill indeterminate" id="progressFill"></div></div>
    <span class="badge loading" id="badge">Reading label…</span>
    <div class="rl">Detected Text</div>
    <div class="rv" id="detectedPart">—</div>
    <div class="rl">Raw OCR Text</div>
    <div class="raw" id="rawText"></div>
  </div>

  <div id="partsSection">
    <button id="toggleParts" onclick="togglePartsList()">📋 Approved Parts List ▾</button>
    <div id="partsList">
      <ul id="partsUl"></ul>
      <div class="add-row">
        <input type="text" id="newPart" placeholder="ADD NEW PART NUMBER" />
        <button onclick="addPart()">Add</button>
      </div>
    </div>
  </div>

<script>
  let selectedFile = null;
  let cachedParts = [];

  // Load parts list on page open
  fetch("/parts").then(r => r.json()).then(p => cachedParts = p).catch(() => {});

  document.getElementById("fileInput").addEventListener("change", e => {
    selectedFile = e.target.files[0];
    if (!selectedFile) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById("preview").src = ev.target.result;
      document.getElementById("preview").style.display = "block";
      document.getElementById("placeholder").style.display = "none";
    };
    reader.readAsDataURL(selectedFile);
    document.getElementById("btnScan").disabled = false;
    document.getElementById("result").style.display = "none";
  });

  async function scan() {
    if (!selectedFile) return;

    const badge = document.getElementById("badge");
    const fill  = document.getElementById("progressFill");

    document.getElementById("result").style.display = "block";
    badge.className = "badge loading";
    badge.textContent = "Reading label…";
    fill.className = "progress-fill indeterminate";
    document.getElementById("detectedPart").textContent = "—";
    document.getElementById("rawText").textContent = "";
    document.getElementById("btnScan").disabled = true;

    const form = new FormData();
    form.append("image", selectedFile);

    try {
      const res  = await fetch("/ocr", { method: "POST", body: form });
      const data = await res.json();

      fill.className = "progress-fill";
      fill.style.width = "100%";

      if (data.error) {
        badge.className = "badge fail";
        badge.textContent = "Error";
        document.getElementById("detectedPart").textContent = data.error;
        return;
      }

      document.getElementById("rawText").textContent    = data.raw_text  || "(empty)";
      document.getElementById("detectedPart").textContent = data.detected || "(nothing)";

      badge.className = "badge " + (data.passed ? "pass" : "fail");
      badge.textContent = data.passed ? "✓ PASS" : "✗ FAIL";

    } catch (err) {
      fill.className = "progress-fill";
      badge.className = "badge fail";
      badge.textContent = "Error";
      document.getElementById("detectedPart").textContent = err.message;
    }
    document.getElementById("btnScan").disabled = false;
  }

  async function togglePartsList() {
    const list = document.getElementById("partsList");
    if (list.style.display === "block") { list.style.display = "none"; return; }
    list.style.display = "block";
    renderParts();
  }
  function renderParts() {
    document.getElementById("partsUl").innerHTML = cachedParts.length
      ? cachedParts.map(p => `<li>${p}</li>`).join("") : "<li>No parts loaded</li>";
  }
  async function addPart() {
    const input = document.getElementById("newPart");
    const pn = input.value.trim().toUpperCase();
    if (!pn) return;
    try { await fetch("/parts", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({part_number: pn}) }); } catch {}
    if (!cachedParts.includes(pn)) { cachedParts.push(pn); cachedParts.sort(); }
    input.value = ""; renderParts();
  }
  document.getElementById("newPart").addEventListener("keydown", e => { if (e.key === "Enter") addPart(); });
</script>
</body>
</html>
